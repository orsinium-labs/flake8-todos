[build-system]
requires = ["flit_core >=3.12,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "flake8-todos"
authors = [{name = "Gram", email = "gram@orsinium.dev"}]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.8"
dynamic = ["version", "description"]
keywords = ["flake8", "flake8-plugin", "linter", "styleguide", "code quality"]
dependencies = ["flake8", "pycodestyle"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Flake8",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["isort[pyproject]", "pytest"]

[project.urls]
Homepage = "https://github.com/orsinium-labs/flake8-todos"

[project.entry-points."flake8.extension"]
T00 = "flake8_todos:Checker"

[tool.mypy]
files = ["mypy_baseline"]
python_version = 3.8
ignore_missing_imports = true
# follow_imports = "silent"
show_error_codes = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.isort]
profile = "django"
lines_after_imports = 2
skip = ".venvs/"
